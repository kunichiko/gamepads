name: gamepads_windows
# NOTE (MimicX fork): upstream declares `resolution: workspace` here. When this
# package is consumed as a git+path dependency, that makes pub resolve against
# the whole monorepo workspace at this commit, dragging OLD sibling packages
# (gamepads_platform_interface, etc.) and cascading ~14 transitive downgrades
# into the host app. Removing it makes this a self-contained package so
# gamepads_platform_interface resolves normally from pub.dev, exactly like the
# published 0.1.4+1 does. This is the only pubspec change vs upstream.
description: Windows implementation of gamepads, a Flutter plugin to handle gamepad input across multiple platforms.
version: 0.1.4+2
homepage: https://github.com/flame-engine/gamepads
repository: https://github.com/flame-engine/gamepads/tree/main/packages/gamepads_windows

flutter:
  plugin:
    implements: gamepads
    platforms:
      windows:
        pluginClass: GamepadsWindowsPluginCApi

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  gamepads_platform_interface: ^0.1.2+1

dev_dependencies:
  flame_lint: ^1.4.1
  flutter_test:
    sdk: flutter
